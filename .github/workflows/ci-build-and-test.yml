name: CI - Build & Test

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build_test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            macos-14,
            macos-15,
            macos-15-intel,
            macos-26,
            macos-26-intel,
            ubuntu-22.04,
            ubuntu-24.04,
            ubuntu-26.04,
            ubuntu-24.04-arm,
            ubuntu-22.04-arm,
            ubuntu-26.04-arm,
            windows-2022,
            windows-2025,
            windows-2025-VS2026
          ]
        node: [18, 19, 20, 21, 22, 23, 24, 25, 26]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Use Node.js v${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
          registry-url: https://registry.yarnpkg.org/

      - name: Install dependencies
        run: yarn --immutable --mode=skip-build

      - name: Build From Source
        run: yarn gyp:build-from-source

      - name: Package build
        run: yarn build

      - name: Test Code
        run: yarn vitest run

  build_test_musl_x86_64:
    name: Build and Test x86_64(musl)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: node:${{ matrix.node }}-alpine
    strategy:
      fail-fast: false
      matrix:
        node: [18, 19, 20, 21, 22, 23, 24, 25, 26]
    steps:
      - name: Setup env with Node v${{ matrix.node }}
        run: |
          apk add --update
          apk add --no-cache ca-certificates git curl build-base python3 g++ make

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install and enable Corepack
        run: |
          npm install -g corepack
          corepack enable
          corepack prepare yarn@4.17.1 --activate

      - name: Install dependencies
        run: yarn --immutable --mode=skip-build

      - name: Build From Source
        run: yarn gyp:build-from-source

      - name: Package build
        run: yarn build

      - name: Test Code
        run: yarn vitest run

  build_test_aarch64:
    name: Build and Test aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
        node: [18, 19, 20, 21, 22, 23, 24, 25, 26]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Use Node.js v${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
          registry-url: https://registry.yarnpkg.org/

      - name: Install dependencies
        run: yarn --immutable --mode=skip-build

      - name: Build From Source
        run: yarn gyp:build-from-source

      - name: Package build
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          CC=aarch64-linux-gnu-gcc CXX=aarch64-linux-gnu-g++ yarn node-pre-gyp --target_arch=arm64 configure build package

      - name: Make TypeScript Build
        run: yarn ts:build

      - name: Test Code
        run: yarn vitest run

  build_test_musl_aarch64:
    name: Build and Test aarch64(musl)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: node:${{ matrix.node }}-alpine
    strategy:
      fail-fast: false
      matrix:
        node: [18, 19, 20, 21, 22, 23, 24, 25, 26]
    steps:
      - name: Setup env with Node v${{ matrix.node }}
        run: |
          apk add --update
          apk add --no-cache ca-certificates git curl build-base python3 g++ make

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install and enable Corepack
        run: |
          npm install -g corepack
          corepack enable
          corepack prepare yarn@4.17.1 --activate

      - name: Setup musl cross compiler
        run: |
          curl -OLksS --connect-timeout 600 --max-time 600 https://musl.cc/aarch64-linux-musl-cross.tgz
          tar -xzvf aarch64-linux-musl-cross.tgz
          $(pwd)/aarch64-linux-musl-cross/bin/aarch64-linux-musl-gcc --version

      - name: Install dependencies
        run: yarn --immutable --mode=skip-build

      - name: Build From Source
        run: yarn gyp:build-from-source

      - name: Package build
        run: |
          CC=$(pwd)/aarch64-linux-musl-cross/bin/aarch64-linux-musl-gcc \
          CXX=$(pwd)/aarch64-linux-musl-cross/bin/aarch64-linux-musl-g++ \
          yarn node-pre-gyp --target_arch=arm64 configure build package

      - name: Make TypeScript Build
        run: yarn ts:build

      - name: Test Code
        run: yarn vitest run
