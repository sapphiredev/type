name: Manual Asset Updater

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag of which the assets should be updated
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            macos-14,
            macos-15,
            macos-15-intel,
            macos-26,
            macos-26-intel,
            ubuntu-22.04,
            ubuntu-24.04,
            ubuntu-26.04,
            ubuntu-24.04-arm,
            ubuntu-22.04-arm,
            ubuntu-26.04-arm,
            windows-2022,
            windows-2025,
            windows-2025-VS2026
          ]
        node: [20, 22, 23, 24, 26]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Use Node.js v${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
          registry-url: https://registry.yarnpkg.org/

      - name: Configure node-gyp to use Visual Studio 2022
        if: matrix.os == 'windows-2025' || matrix.os == 'windows-2025-VS2026' || (matrix.os == 'windows-2022' && matrix.node == 26)
        shell: pwsh
        run: |
          'npm_config_msvs_version=2022' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'npm_config_gyp_msvs_version=2022' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'GYP_MSVS_VERSION=2022' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Work around Node 26 LTO flags on windows-2022
        if: matrix.os == 'windows-2022' && matrix.node == 26
        shell: pwsh
        run: |
          'GYP_DEFINES=clang=0' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        run: yarn --immutable --mode=skip-build

      - name: Build From Source
        run: yarn gyp:build-from-source

      - name: Package prebuild
        run: yarn build

      - name: Upload prebuild asset
        uses: ./scripts/prebuildArtifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path: 'build/stage/**/*.tar.gz'
          release-tag: ${{ github.event.inputs.tag }}

  build_musl_x86_64:
    name: Prebuild x86_64(musl)
    runs-on: ubuntu-latest
    container:
      image: node:${{ matrix.node }}-alpine
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 23, 24, 26]
    steps:
      - name: Setup env with Node v${{ matrix.node }}
        run: |
          apk add --update
          apk add --no-cache ca-certificates git curl build-base python3 g++ make

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install and enable Corepack
        run: |
          if ! command -v corepack >/dev/null 2>&1; then
            npm install -g corepack --ignore-scripts --force
          fi
          corepack enable
          corepack prepare yarn@4.17.1 --activate

      - name: Install dependencies
        run: yarn --immutable --mode=skip-build

      - name: Build From Source
        run: yarn gyp:build-from-source

      - name: Package prebuild
        run: yarn build

      - name: Upload prebuild asset
        uses: ./scripts/prebuildArtifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path: 'build/stage/**/*.tar.gz'
          release-tag: ${{ github.event.inputs.tag }}

  build_aarch64:
    name: Prebuild aarch64
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
        node: [20, 22, 23, 24, 26]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Use Node.js v${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
          registry-url: https://registry.yarnpkg.org/

      - name: Install dependencies
        run: yarn --immutable --mode=skip-build

      - name: Build From Source
        run: yarn gyp:build-from-source

      - name: Package prebuild
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          CC=aarch64-linux-gnu-gcc CXX=aarch64-linux-gnu-g++ yarn node-pre-gyp --target_arch=arm64 configure build package

      - name: Make TypeScript Build
        run: yarn ts:build

      - name: Upload prebuild asset
        uses: ./scripts/prebuildArtifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path: 'build/stage/**/*.tar.gz'
          release-tag: ${{ github.event.inputs.tag }}

  build_musl_aarch64:
    name: Prebuild aarch64(musl)
    runs-on: ubuntu-latest
    container:
      image: node:${{ matrix.node }}-alpine
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 23, 24, 26]
    steps:
      - name: Setup env with Node v${{ matrix.node }}
        run: |
          apk add --update
          apk add --no-cache ca-certificates git curl build-base python3 g++ make

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install and enable Corepack
        run: |
          if ! command -v corepack >/dev/null 2>&1; then
            npm install -g corepack --ignore-scripts --force
          fi
          corepack enable
          corepack prepare yarn@4.17.1 --activate

      - name: Setup musl cross compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo musl-cc/musl.cc --pattern aarch64-linux-musl-cross.tgz
          tar -xzvf aarch64-linux-musl-cross.tgz
          $(pwd)/aarch64-linux-musl-cross/bin/aarch64-linux-musl-gcc --version

      - name: Install dependencies
        run: yarn --immutable --mode=skip-build

      - name: Build From Source
        run: yarn gyp:build-from-source

      - name: Package prebuild
        run: |
          CC=$(pwd)/aarch64-linux-musl-cross/bin/aarch64-linux-musl-gcc \
          CXX=$(pwd)/aarch64-linux-musl-cross/bin/aarch64-linux-musl-g++ \
          yarn node-pre-gyp --target_arch=arm64 configure build package

      - name: Make TypeScript Build
        run: yarn ts:build

      - name: Upload prebuild asset
        uses: ./scripts/prebuildArtifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path: 'build/stage/**/*.tar.gz'
          release-tag: ${{ github.event.inputs.tag }}
